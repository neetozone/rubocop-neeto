Neeto/UnsafeTableDeletion:
  Description: >-
    `drop_table` is considered as a dangerous operation. If not used correctly,
    it could cause irreversible data loss. It is advised to rename the table
    to `table_name_deprecated_on_yyyy_mm_dd` instead. The renamed table can be
    safely dropped in a later migration. The cop permits dropping tables
    that are named in the above format.
  Enabled: true
  Severity: refactor
  VersionAdded: '0.1'
  Include:
    - db/**/*.rb

Neeto/UnsafeColumnDeletion:
  Description: >-
    `remove_column` is considered as a dangerous operation. If not used
    correctly, it could cause irreversible data loss. It is advised to rename
    the column to `column_name_deprecated_on_yyyy_mm_dd` instead. The renamed
    column can be safely removed in a later migration. The cop permits
    removing columns that are named in the above format.
  Enabled: true
  Severity: refactor
  VersionAdded: '0.1'
  Include:
    - db/**/*.rb

Neeto/DirectEnvAccess:
  Description: >-
    `config/secrets.yml` provides a single source of truth for all environment
    variables and their fallback values, loaded via Rails' built-in
    `config_for`. Direct usage of `ENV` bypasses this system, making it harder
    to track what environment variables are being used and their defaults.
    Use `Rails.application.secrets` instead.
  Enabled: true
  Severity: refactor
  VersionAdded: '0.1'
  Include:
    - app/**/*.rb

Neeto/DeprecatedJobBaseClass:
  Description: >-
    Jobs should not inherit directly from the legacy
    `NeetoCommonsBackend::BaseJobs::*` base classes. Use latency-based job
    classes such as `LatencyBasedJobs::Within5Seconds`,
    `LatencyBasedJobs::Within1Minute`, `LatencyBasedJobs::Within5Minutes`,
    or `LatencyBasedJobs::Within1Hour` instead.
  Enabled: true
  Severity: refactor
  VersionAdded: '0.1'
  Include:
    - app/jobs/**/*.rb
    - app/workers/**/*.rb
    - test/dummy/app/jobs/**/*.rb
    - test/dummy/app/workers/**/*.rb

Neeto/FaradayOverHttparty:
  Description: >-
    HTTParty has been removed from all Neeto applications in favor of Faraday,
    which is already available. Do not re-add the `httparty` gem. See
    https://github.com/neetozone/neeto-engineering/issues/1862 for more details.
  Enabled: true
  Severity: refactor
  VersionAdded: '0.1'
  Include:
    - '**/Gemfile'
    - '**/Gemfile.common.rb'

Neeto/HtmlSafeOnDynamicString:
  Description: >-
    `html_safe`, `raw` and `safe_concat` mark a string as already safe, so
    Rails emits it without escaping. Calling them on dynamic values
    (interpolation, method results, variables) turns off output escaping for
    that value. Build markup with `tag`, `content_tag`, `link_to`, `mail_to`
    or `safe_join` instead, or annotate a reviewed call with
    `# neeto:html-safe-reviewed <reason>`.
  Enabled: false
  Severity: error
  VersionAdded: '0.1'
  Include:
    - app/**/*.rb
    - lib/**/*.rb
    - app/views/**/*.erb
    - app/views/**/*.inky

Neeto/HtmlInStringLiteral:
  Description: >-
    Plain Ruby strings never escape what is interpolated into them. Build
    markup outside views with `tag`, `content_tag`, `link_to`, `mail_to`,
    `safe_join` or a partial instead of string literals and heredocs.
  Enabled: false
  Severity: error
  VersionAdded: '0.1'
  Include:
    - app/**/*.rb
    - lib/**/*.rb
  Exclude:
    - app/views/**/*
    - lib/tasks/**/*

Neeto/DirectLiquidRender:
  Description: >-
    `Liquid::Template#render` does not escape its output. Build and render
    Liquid templates only through the shared renderer, which requires an
    explicit output format (`:html` or `:text`).
  Enabled: false
  Severity: error
  VersionAdded: '0.1'
  Include:
    - app/**/*.rb
    - lib/**/*.rb
  Exclude:
    - '**/neeto_liquid.rb'
    - '**/neeto_liquid/**/*.rb'
    - '**/liquid_template_validatable.rb'
